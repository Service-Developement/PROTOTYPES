/* Brand system of Dhofar Municipality: deep purple + teal, Dubai type. Layout: app shell, right sidebar, working canvas. Single light theme by choice. */
:root{
  --pu:#3E1563; --pu2:#55237F; --teal:#2FB8BB; --tealL:#E7F6F6; --lav:#F2EEF8;
  --ink:#24212B; --muted:#6B7280; --line:#E2E6EC; --bg:#F3F6F9; --card:#FFFFFF;
  --ok:#2E8A6E; --okL:#E4F4EE; --warn:#B47B17; --warnL:#FDF3DF; --bad:#B4485A; --badL:#FBEAEC; --info:#4E6FA6; --infoL:#EAF0FA;
  --f:"Dubai Web",Dubai,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.idn{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;height:100%}
.demo{grid-column:1/-1;background:var(--warnL);color:#7A5410;font-size:13px;text-align:center;padding:5px 12px;border-bottom:1px solid #F0DDB3}
aside{background:var(--pu);color:#fff;display:flex;flex-direction:column;padding:18px 14px;gap:6px;overflow:auto}
aside .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
aside .brand img{width:52px}
aside .brand b{font-size:15px;line-height:1.4}
aside .brand small{display:block;color:#B9A8D6;font-size:12px;font-weight:400}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:#D8CCEA;font-size:15px;position:relative}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--pu2);color:#fff;font-weight:700}
.nav button.on::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--teal)}
.nav button:focus-visible{outline:2px solid var(--teal)}
.nav .ic{width:20px;text-align:center;opacity:.9}
.nav .badge{margin-right:auto;background:var(--teal);color:var(--pu);border-radius:20px;font-size:12px;font-weight:700;padding:0 8px}
aside .foot{margin-top:auto;font-size:12px;color:#B9A8D6;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.12)}
aside .foot a{color:var(--teal)}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
header.top{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:12px 26px}
header.top h1{margin:0;font-size:17px;color:var(--pu);text-wrap:balance}
header.top .sp{flex:1}
.role{display:flex;align-items:center;gap:8px;background:var(--lav);border-radius:30px;padding:4px 6px 4px 14px}
.role .dot{width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--pu);display:grid;place-items:center;font-weight:700}
.role select{border:0;background:transparent;font-weight:700;color:var(--pu);padding:4px}
.content{overflow:auto;padding:24px 26px 60px;flex:1}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* common */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:24px;color:var(--pu);text-wrap:balance}
.ph p{margin:0;color:var(--muted)}
.ph .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card h3{margin:0 0 12px;font-size:16px;color:var(--pu)}
.btn{border:0;border-radius:10px;padding:9px 18px;font-weight:700;background:var(--pu);color:#fff;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.12)}
.btn.teal{background:var(--teal);color:#fff}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.ghost{background:#fff;color:var(--pu);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-block;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.st-draft{background:var(--warnL);color:var(--warn)}
.st-review{background:var(--infoL);color:var(--info)}
.st-returned{background:var(--badL);color:var(--bad)}
.st-approved{background:var(--okL);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;position:relative;overflow:hidden;cursor:pointer;text-align:right}
.kpi::before{content:"";position:absolute;right:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--c,var(--teal))}
.kpi small{color:var(--muted);display:block}
.kpi b{font-size:30px;color:var(--c,var(--pu));line-height:1.3}
.kpi:hover{border-color:var(--c,var(--teal))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:var(--tealL);color:var(--pu);font-weight:700;text-align:right;padding:11px 14px;font-size:14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAF8FD}
.muted{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;min-width:150px}
.filters input{flex:1;min-width:220px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:130px 1fr 40px;gap:12px;align-items:center}
.bar .t{height:12px;background:#EEF1F5;border-radius:10px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:10px;background:var(--c)}
.bar b{text-align:left;color:var(--c)}
.list .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.list .row:last-child{border-bottom:0}

/* form wizard */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.step{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:96px;flex:1;text-align:center;font-size:13px;color:var(--muted)}
.step .c{width:34px;height:34px;border-radius:50%;background:#E3E8EE;color:var(--pu);display:grid;place-items:center;font-weight:700}
.step.on{color:var(--pu);font-weight:700}
.step.on .c{background:var(--teal);color:#fff}
.step.done .c{background:var(--ok);color:#fff}
.step.err .c{background:var(--bad);color:#fff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-weight:700;color:var(--pu);font-size:14px}
.fld label .req{color:var(--bad)}
.fld input,.fld select,.fld textarea{border:1px solid #D7DDE5;border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.fld textarea{min-height:90px;resize:vertical}
.fld .hint{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #D7DDE5;border-radius:20px;padding:5px 12px;background:#fff;cursor:pointer;user-select:none}
.chip input{accent-color:var(--pu)}
.chip:has(input:checked){background:var(--lav);border-color:var(--pu2);color:var(--pu);font-weight:700}
.factions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.factions .sp{flex:1}
.status-line{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px}
.map{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#EAF1EE;aspect-ratio:16/10;cursor:crosshair}
.map svg{width:100%;height:100%;display:block}
.map .tag{position:absolute;top:10px;right:10px;background:#fff;border-radius:20px;padding:3px 12px;font-size:13px;color:var(--ok);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.map .help{position:absolute;bottom:8px;right:10px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:1px 8px;border-radius:6px}
.loc{display:grid;grid-template-columns:300px 1fr;gap:20px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.ph-slot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.ph-slot .img{aspect-ratio:4/3;background:var(--tealL);display:grid;place-items:center;color:#7FB9B9;font-size:13px;position:relative}
.ph-slot .img img{width:100%;height:100%;object-fit:cover}
.ph-slot .img .x{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:26px;height:26px}
.ph-slot .cap{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700;color:var(--pu);font-size:14px}
.ph-slot label.up{font-size:12.5px;color:var(--teal);cursor:pointer;font-weight:700}
.ph-slot input{display:none}
.docs .row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff}

/* record view */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 24px}
.kv div{padding:8px 0;border-bottom:1px dashed var(--line)}
.kv small{display:block;color:var(--muted);font-size:12.5px}
.kv b{font-weight:500}
.chk{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 22px 14px 0}
.timeline li::before{content:"";position:absolute;right:5px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--teal)}
.timeline li::after{content:"";position:absolute;right:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline small{color:var(--muted);display:block}
.note-box{background:var(--badL);border-right:4px solid var(--bad);border-radius:8px;padding:10px 14px;color:#7D2C3A}
.ok-box{background:var(--okL);border-right:4px solid var(--ok);border-radius:8px;padding:10px 14px;color:#1F5E4B}
.perm td:not(:first-child){text-align:center}
.perm .y{color:var(--ok);font-weight:700}
.perm .n{color:#B5BCC6}
.switch{all:unset;cursor:pointer;width:42px;height:24px;border-radius:20px;background:#CBD2DB;position:relative;display:inline-block}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ok)}
.switch.on::after{right:21px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(30,14,48,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 12px;color:var(--pu)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--pu);color:#fff;padding:10px 20px;border-radius:12px;opacity:0;transition:.25s;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* responsive (tablet in field) */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  aside{flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto}
  aside .brand{border:0;padding:0 4px;margin:0}
  aside .brand img{width:40px}
  aside .brand div,aside .foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:8px 12px}
  .nav button.on::after{left:8px;right:8px;top:auto;bottom:2px;width:auto;height:3px}
  .grid2,.loc,.fgrid{grid-template-columns:1fr}
  header.top{padding:10px 16px;flex-wrap:wrap}
  .content{padding:16px 16px 60px}
}
</style>

function collect(){
  var d=S.draft;if(!d)return;
  function v(id){var e=document.getElementById(id);return e?e.value.trim():null;}
  var map={f_name:'name',f_wilaya:'wilaya',f_area:'area',f_plot:'plot',f_type:'type',f_year:'year',f_visit:'visit',f_owner:'owner',f_phone:'phone',f_mgmt:'mgmt',f_shops:'shops',f_notes:'notes'};
  Object.keys(map).forEach(function(id){var x=v(id);if(x!==null)d[map[id]]=x;});
  var la=v('f_lat'),ln=v('f_lng');
  if(la!==null){d.lat=la?parseFloat(la)||null:null;}
  if(ln!==null){d.lng=ln?parseFloat(ln)||null:null;}
  if(document.querySelector('input[name=act]'))d.activities=[].map.call(document.querySelectorAll('input[name=act]:checked'),function(e){return e.value;});
  if(document.querySelector('input[name=fac]'))d.facilities=[].map.call(document.querySelectorAll('input[name=fac]:checked'),function(e){return e.value;});
}
function commit(status,action,note){
  var d=S.draft;d.status=status;
  d.history.push({t:now(),who:me(),a:action,n:note});
  var ex=rec(d.id);var copy=Object.assign({},d);delete copy._new;
  if(ex){Object.assign(ex,copy);} else {DB.records.unshift(copy);DB.seq++;}
  d._new=false;
}
function bindForm(){
  var gps=$('#gps');
  if(gps) gps.onclick=function(){collect();var d=S.draft;var c=WILAYAT[d.wilaya]||WILAYAT['صلالة'];
    d.lat=+(c[0]+(Math.random()-.5)*.02).toFixed(4);d.lng=+(c[1]+(Math.random()-.5)*.03).toFixed(4);render();toast('تم التقاط الإحداثيات (محاكاة)');};
  var mp=$('#map');
  if(mp) mp.onclick=function(e){collect();var d=S.draft;var c=WILAYAT[d.wilaya]||WILAYAT['صلالة'];var b=mp.getBoundingClientRect();
    var x=(e.clientX-b.left)/b.width*1000,y=(e.clientY-b.top)/b.height*620;
    d.lng=+(c[1]+(x-500)/6000).toFixed(4);d.lat=+(c[0]-(y-300)/6000).toFixed(4);render();};
  document.querySelectorAll('input[data-ph]').forEach(function(inp){inp.onchange=function(){
    var f=inp.files[0];if(!f)return;collect();var k=inp.getAttribute('data-ph');
    var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var cv=document.createElement('canvas'),s=Math.min(1,800/img.width);cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      S.draft.photos[k]={name:f.name,src:cv.toDataURL('image/jpeg',.82)};render();toast('تمت إضافة الصورة');};img.onerror=function(){toast('تعذّر قراءة الصورة، جرّب صورة بصيغة JPG أو PNG');};img.src=rd.result;};rd.readAsDataURL(f);};});
  var di=$('#docIn');
  if(di) di.onchange=function(){collect();[].forEach.call(di.files,function(f){S.draft.docs.push({name:f.name});});render();toast('تم إرفاق الملف');};
}
function validateAll(){var errs={},ok=true;for(var i=0;i<STEPS.length;i++){if(!stepValid(S.draft,i)){errs[i]=1;ok=false;}}S.stepErr=errs;return ok;}

  var t=e.target.closest('[data-go],[data-new],[data-edit],[data-view],[data-step],[data-filter],[data-rmph],[data-rmdoc],[data-tog],#next,#prev,#saveDraft,#submit,#approve,#returnBtn,#exportBtn,#addUser,#copyCsv,#saveUser');
  if(!t)return;
  if(t.hasAttribute('data-go')){if(S.page==='form')collect();go(t.getAttribute('data-go'));return;}
  if(t.hasAttribute('data-new')){startEdit(null);return;}
  if(t.hasAttribute('data-edit')){e.stopPropagation();startEdit(t.getAttribute('data-edit'));return;}
  if(t.hasAttribute('data-view')){e.stopPropagation();go('view',{viewId:t.getAttribute('data-view')});return;}
  if(t.hasAttribute('data-filter')){S.fs=t.getAttribute('data-filter');S.fw='';S.q='';go(can('reports')&&S.page==='reports'?'reports':'list');return;}
  if(t.hasAttribute('data-step')){collect();S.step=+t.getAttribute('data-step');render();return;}
  if(t.hasAttribute('data-rmph')){collect();delete S.draft.photos[t.getAttribute('data-rmph')];render();return;}
  if(t.hasAttribute('data-rmdoc')){collect();S.draft.docs.splice(+t.getAttribute('data-rmdoc'),1);render();return;}
  if(t.hasAttribute('data-tog')){var u=DB.users[+t.getAttribute('data-tog')];u.active=!u.active;render();toast((u.active?'تم تفعيل ':'تم إيقاف ')+u.name);return;}
  switch(t.id){
    case 'next': collect();if(!stepValid(S.draft,S.step)){S.stepErr[S.step]=1;toast('بعض الحقول المطلوبة في «'+STEPS[S.step]+'» غير مكتملة، ويمكنك المتابعة واستكمالها لاحقاً');}else{delete S.stepErr[S.step];}S.step++;render();break;
    case 'prev': collect();S.step--;render();break;
    case 'saveDraft': collect();if(!S.draft.name){toast('أدخل اسم السوق أولاً لحفظ المسودة');S.step=0;render();break;}
      var wasRet=S.draft.status==='returned';commit(wasRet?'returned':'draft','حفظ مسودة');toast('تم حفظ المسودة رقم \u2066'+S.draft.id+'\u2069');render();break;
    case 'submit': collect();if(!validateAll()){var first=Object.keys(S.stepErr)[0];S.step=+first;render();toast('لا يمكن الإرسال قبل استكمال الأقسام المعلّمة باللون الأحمر');break;}
      var id=S.draft.id;commit('review','إرسال للمراجعة');S.draft=null;toast('تم إرسال الاستمارة \u2066'+id+'\u2069 للمراجعة');go('view',{viewId:id});break;
    case 'approve': var r=rec(S.viewId),n=$('#rnote').value.trim();r.status='approved';r.reviewer=me();r.reviewNote=n;r.history.push({t:now(),who:me(),a:'اعتماد مبدئي',n:n});toast('تم الاعتماد المبدئي للسجل \u2066'+r.id+'\u2069');render();break;
    case 'returnBtn': var r2=rec(S.viewId),n2=$('#rnote').value.trim();if(!n2){$('#rnote').focus();toast('اكتب ملاحظة توضح عناصر الاستيفاء المطلوبة');break;}
      r2.status='returned';r2.reviewer=me();r2.reviewNote=n2;r2.history.push({t:now(),who:me(),a:'إعادة للاستيفاء',n:n2});toast('أُعيدت الاستمارة إلى فريق الحصر');render();break;
    case 'exportBtn': var L=filtered();modal('<h3>تقرير السجلات</h3><p class="muted">عدد السجلات: <span class="num">'+L.length+'</span>'+(S.fw?' · الولاية: '+esc(S.fw):'')+(S.fs?' · الحالة: '+STATUS[S.fs][0]:'')+'</p><div class="tbl"><table style="min-width:0"><thead><tr><th>الحالة</th><th>العدد</th></tr></thead><tbody>'+['draft','review','returned','approved'].map(function(k){return '<tr><td>'+STATUS[k][0]+'</td><td class="num">'+counts(L)[k]+'</td></tr>';}).join('')+'</tbody></table></div><p class="muted" style="font-size:13px">يمكن نسخ البيانات بصيغة CSV ولصقها في Excel.</p><div class="factions"><button class="btn" id="copyCsv">نسخ البيانات (CSV)</button><button class="btn ghost" data-close="1">إغلاق</button></div>');break;
    case 'copyCsv': var data=csv();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(data):Promise.reject()).then(function(){toast('تم نسخ البيانات، الصقها في Excel');closeModal();},function(){$('#mbox').insertAdjacentHTML('beforeend','<textarea style="width:100%;height:140px;margin-top:10px" readonly>'+esc(data)+'</textarea><p class="muted">تعذّر النسخ التلقائي، حدّد النص وانسخه يدوياً.</p>');});break;
    case 'addUser': modal('<h3>إضافة مستخدم</h3><div class="fgrid"><div class="fld full"><label for="nu_name">اسم المستخدم</label><input id="nu_name" placeholder="مثال: فريق ميداني 04"></div><div class="fld full"><label for="nu_role">الدور</label><select id="nu_role">'+Object.keys(ROLES).map(function(k){return '<option value="'+k+'">'+ROLES[k].name+'</option>';}).join('')+'</select></div></div><div class="factions" style="margin-top:16px"><button class="btn" id="saveUser">إضافة</button><button class="btn ghost" data-close="1">إلغاء</button></div>');break;
    case 'saveUser': var nm=$('#nu_name').value.trim();if(!nm){$('#nu_name').focus();return;}DB.users.push({name:nm,role:$('#nu_role').value,active:true});closeModal();render();toast('تمت إضافة '+nm);break;
  }
});
render();
})();

</script>
</body>
</html>
